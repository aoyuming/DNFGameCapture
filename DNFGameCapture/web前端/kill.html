<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNF 击杀展示页</title>
    <link rel="stylesheet" href="kill.css?v=20260617-kill-display">
</head>
<body>
    <main id="kill-display-root" class="kill-display-root" aria-live="polite">
        <div class="kill-board" id="kill-board">
            <section class="kill-team kill-team-red" data-team-color="red">
                <header class="kill-team-header">
                    <div class="kill-team-title">
                        <span class="kill-team-name">红队</span>
                        <span class="kill-team-score" id="kill-red-score">0</span>
                    </div>
                    <div class="kill-stat-header">
                        <span data-style-key="killNumber" data-fit-text>杀</span>
                        <span data-style-key="deathNumber" data-fit-text>死</span>
                        <span data-style-key="akMark" data-fit-text>AK</span>
                    </div>
                </header>
                <div class="kill-rows" id="kill-red-rows"></div>
            </section>

            <section class="kill-team kill-team-blue" data-team-color="blue">
                <header class="kill-team-header">
                    <div class="kill-team-title">
                        <span class="kill-team-name">蓝队</span>
                        <span class="kill-team-score" id="kill-blue-score">0</span>
                    </div>
                    <div class="kill-stat-header">
                        <span data-style-key="killNumber" data-fit-text>杀</span>
                        <span data-style-key="deathNumber" data-fit-text>死</span>
                        <span data-style-key="akMark" data-fit-text>AK</span>
                    </div>
                </header>
                <div class="kill-rows" id="kill-blue-rows"></div>
            </section>
        </div>
        <div class="kill-status" id="kill-status">等待数据...</div>
        <section class="kill-edit-toolbar" id="kill-edit-toolbar" hidden aria-label="kill display appearance editor">
            <div class="kill-edit-head">
                <strong>外观编辑</strong>
                <span>F2/双击隐藏</span>
            </div>
            <label>
                <span>对象</span>
                <select id="kill-edit-target">
                    <option value="page">整体页面</option>
                    <option value="teamName">队伍名</option>
                    <option value="pickLabel">选人顺序</option>
                    <option value="playerName">主号</option>
                    <option value="killNumber">杀</option>
                    <option value="deathNumber">死</option>
                    <option value="akMark">AK</option>
                    <option value="akCountBadge">AK次数</option>
                </select>
            </label>
            <label class="kill-edit-check">
                <span>死亡</span>
                <input id="kill-edit-show-death" type="checkbox" checked>
            </label>
            <label>
                <span>字体</span>
                <select id="kill-edit-font"></select>
            </label>
            <div class="kill-edit-grid">
                <label><span>字号</span><input id="kill-edit-size" type="number" min="10" max="76" step="1"></label>
                <label><span>颜色</span><input id="kill-edit-color" type="color"></label>
                <label><span>描边</span><input id="kill-edit-stroke" type="number" min="0" max="8" step="1"></label>
                <label><span>字距</span><input id="kill-edit-letter" type="number" min="-4" max="16" step="1"></label>
                <label><span>发光</span><input id="kill-edit-glow" type="number" min="0" max="36" step="1"></label>
                <label><span id="kill-edit-width-label">列宽</span><input id="kill-edit-width" type="number" min="0" max="120" step="1"></label>
            </div>
            <div class="kill-edit-hint">拖文字移动整列；空白滚轮缩放整页；滚轮改字号，Shift+滚轮改列宽/间距，Ctrl+滚轮改描边。</div>
        </section>
        <div class="kill-resize-grip" id="kill-resize-grip" aria-hidden="true"></div>
    </main>
    <script src="kill.js?v=20260617-kill-display" defer></script>
</body>
</html>
