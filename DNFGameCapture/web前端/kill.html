<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNF 击杀展示页</title>
    <script>if (/(?:^|[?&])mode=fx(?:&|$)/.test(location.search)) document.documentElement.classList.add('kill-fx-fullscreen');</script>
    <link rel="stylesheet" href="kill.css?v=20260930-5.5.6-2">
</head>
<body>
    <main id="kill-display-root" class="kill-display-root" data-skin="ink" aria-live="polite">
        <button class="kill-window-skin" id="kill-window-skin" type="button" title="切换界面风格 / 自定义背景" aria-label="切换界面风格"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 0 0 0 18c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16a5 5 0 0 0 5-5c0-4.42-4.03-8-9-8zm-5.5 9a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3-4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3 4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg></button>
        <button class="kill-window-settings" id="kill-window-settings" type="button" title="打开外观设置" aria-label="打开外观设置">⚙</button>
        <button class="kill-window-close" id="kill-window-close" type="button" title="关闭展示窗口" aria-label="关闭展示窗口">×</button>
        <div class="kill-board" id="kill-board">
            <section class="kill-team kill-team-red" data-team-color="red">
                <header class="kill-team-header">
                    <div class="kill-team-title">
                        <span class="kill-team-name">红队</span>
                        <span class="kill-team-score" id="kill-red-score">0</span>
                    </div>
                    <div class="kill-stat-header">
                        <span data-style-key="killNumber" data-fit-text>杀</span>
                        <span data-style-key="deathNumber" data-fit-text>死</span>
                        <span data-style-key="akMark" data-fit-text>AK</span>
                    </div>
                </header>
                <div class="kill-rows" id="kill-red-rows"></div>
            </section>

            <section class="kill-team kill-team-blue" data-team-color="blue">
                <header class="kill-team-header">
                    <div class="kill-team-title">
                        <span class="kill-team-name">蓝队</span>
                        <span class="kill-team-score" id="kill-blue-score">0</span>
                    </div>
                    <div class="kill-stat-header">
                        <span data-style-key="killNumber" data-fit-text>杀</span>
                        <span data-style-key="deathNumber" data-fit-text>死</span>
                        <span data-style-key="akMark" data-fit-text>AK</span>
                    </div>
                </header>
                <div class="kill-rows" id="kill-blue-rows"></div>
            </section>
        </div>
        <section class="kill-skin-panel" id="kill-skin-panel" hidden aria-label="界面风格">
            <div class="kill-skin-panel-head">
                <strong>界面风格</strong>
                <button class="kill-skin-panel-close" id="kill-skin-panel-close" type="button" title="关闭 (Esc)" aria-label="关闭">×</button>
            </div>
            <div class="kill-skin-grid" id="kill-skin-grid"></div>
            <label class="kill-skin-apply"><input id="kill-skin-apply-colors" type="checkbox" checked><span>切换时套用推荐文字配色</span></label>
            <label class="kill-skin-apply" title="文字 / 击杀 / 全屏特效的详细开关与时间在主窗口「特效管理」里设置"><input id="kill-fx-enabled" type="checkbox" checked><span>特效总开关（详细设置见主窗口「特效管理」）</span></label>
            <label class="kill-bg-range kill-fx-scale-row" title="全屏击杀特效在主窗口「特效管理」中开启"><span>全屏特效大小</span><input id="kill-fx-scale" type="range" min="50" max="200" step="5"><b id="kill-fx-scale-val">100%</b></label>
            <div class="kill-bg-section">
                <div class="kill-bg-head"><strong>自定义背景</strong><span id="kill-bg-state">未设置</span></div>
                <div class="kill-bg-actions">
                    <button id="kill-bg-pick" type="button">选择图片</button>
                    <button id="kill-bg-reset" type="button" title="缩放 100%（铺满）并居中">复位</button>
                    <button id="kill-bg-clear" type="button" class="danger">移除</button>
                </div>
                <input id="kill-bg-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" hidden>
                <label class="kill-bg-range"><span>缩放</span><input id="kill-bg-scale" type="range" min="10" max="400" step="1"><b id="kill-bg-scale-val">100%</b></label>
                <label class="kill-bg-range"><span>图片透明</span><input id="kill-bg-opacity" type="range" min="0" max="100" step="1"><b id="kill-bg-opacity-val">100%</b></label>
                <label class="kill-bg-range"><span>面板透明</span><input id="kill-bg-panel" type="range" min="0" max="100" step="1"><b id="kill-bg-panel-val">49%</b></label>
                <p class="kill-bg-hint">面板打开时：在画面上<b>拖动</b>移动背景，<b>滚轮</b>缩放；也可把图片直接拖进窗口。</p>
            </div>
        </section>
        <div class="kill-status" id="kill-status">等待数据...</div>
        <section class="kill-edit-toolbar" id="kill-edit-toolbar" hidden aria-label="kill display appearance editor">
            <div class="kill-edit-head">
                <strong>外观编辑</strong>
                <span>F2/双击隐藏</span>
                <button class="kill-edit-exit" id="kill-edit-exit" type="button">退出编辑</button>
            </div>
            <label>
                <span>对象</span>
                <select id="kill-edit-target">
                    <option value="page">整体页面</option>
                    <option value="teamName">队伍名</option>
                    <option value="pickLabel">选人顺序</option>
                    <option value="playerName">选手</option>
                    <option value="killNumber">杀</option>
                    <option value="deathNumber">死</option>
                    <option value="akMark">AK</option>
                    <option value="akCountBadge">AK次数</option>
                </select>
            </label>
            <div class="kill-edit-skin-row">
                <label>
                    <span>风格</span>
                    <select id="kill-edit-skin"></select>
                </label>
                <button class="kill-edit-skin-colors" id="kill-edit-skin-colors" type="button" title="把当前风格的推荐文字颜色套用到所有文字（保留字体和字号）">套用配色</button>
            </div>
            <label class="kill-edit-check">
                <span>死亡</span>
                <input id="kill-edit-show-death" type="checkbox" checked>
            </label>
            <label>
                <span>字体</span>
                <select id="kill-edit-font"></select>
            </label>
            <div class="kill-edit-grid">
                <label><span>字号</span><input id="kill-edit-size" type="number" min="10" max="76" step="1"></label>
                <label><span>颜色</span><input id="kill-edit-color" type="color"></label>
                <label><span>描边</span><input id="kill-edit-stroke" type="number" min="0" max="8" step="1"></label>
                <label><span>字距</span><input id="kill-edit-letter" type="number" min="-4" max="16" step="1"></label>
                <label><span>发光</span><input id="kill-edit-glow" type="number" min="0" max="36" step="1"></label>
                <label><span id="kill-edit-width-label">列宽</span><input id="kill-edit-width" type="number" min="0" max="120" step="1"></label>
            </div>
            <div class="kill-edit-hint">拖文字移动整列；空白滚轮缩放整页；滚轮改字号，Shift改宽度，Ctrl改描边。</div>
        </section>
        <div class="kill-resize-grip" id="kill-resize-grip" aria-hidden="true"></div>
    </main>
    <script src="scene-rules.js?v=20260930-5.5.6-2" defer></script>
    <script src="kill.js?v=20260930-5.5.6-2" defer></script>
</body>
</html>
