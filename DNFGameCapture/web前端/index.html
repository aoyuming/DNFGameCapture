<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNF 赛事计分板 - WebView2 版</title>
    <meta name="dnf-web-layout-version" content="20260622-kill-display-toggle">
    <link rel="stylesheet" href="style.css?v=20260622-kill-display-toggle">
</head>
<body>

    <div class="app-shell">
        <div class="left-stack">
            <div class="main-container" id="main-container">
                <div class="teams-wrap" id="teams-wrap">
                    <div class="team-panel team-red" id="team-red">
                        <div class="stats-header">
                            <div class="team-name"><span class="team-name-label">红队</span> <input type="text" class="team-score-input" value="0"></div>
                            <div class="stats-labels">
                                <span>击杀</span>
                                <span>死亡</span>
                                <span>AK</span>
                            </div>
                        </div>
                        <div class="rows-container"></div>
                    </div>

                    <div class="team-panel team-blue" id="team-blue">
                        <div class="stats-header">
                            <div class="team-name"><span class="team-name-label">蓝队</span> <input type="text" class="team-score-input" value="0"></div>
                            <div class="stats-labels">
                                <span>击杀</span>
                                <span>死亡</span>
                                <span>AK</span>
                            </div>
                        </div>
                        <div class="rows-container"></div>
                    </div>
                </div>
            </div>

            <div class="control-panel">
                <div class="control-row control-row-match">
                    <button class="ctrl-btn btn-swap" id="btn-swap">🔄 翻转红蓝</button>
                    <button class="ctrl-btn btn-monitor-start" id="btn-monitor">▶ 运行</button>
                    <button class="ctrl-btn btn-reset" id="btn-reset">✨ 重置战绩</button>
                    <button class="ctrl-btn btn-pro" id="btn-pro">👑 专业模式</button>
                    <button class="ctrl-btn btn-kill-display-toggle" id="btn-kill-display-toggle" aria-pressed="false">🖥 展示页面</button>
                </div>
                <div class="control-row control-row-aux">
                    <button class="ctrl-btn btn-review-toggle" id="btn-review-toggle" aria-expanded="false">
                        <span>&#26368;&#36817;&#35782;&#21035;</span>
                        <span class="review-toggle-count" id="review-toggle-count">0</span>
                    </button>
                    <button class="ctrl-btn btn-auth" id="btn-auth">🔑 授权</button>
                    <button class="ctrl-btn btn-appearance" id="btn-appearance">🎨 外观</button>
                    <label class="output-seat-label-toggle" title="开启后，仅在 击杀.txt 的名字前输出选人顺序">
                        <input type="checkbox" id="output-seat-label-toggle">
                        <span>选人顺序</span>
                    </label>
                    <label class="kill-show-death-toggle" title="控制击杀展示页是否显示死亡次数">
                        <input type="checkbox" id="kill-show-death-toggle-main">
                        <span>显示死亡</span>
                    </label>
                    <div class="more-controls-wrap" id="more-controls-wrap">
                        <button class="ctrl-btn btn-more-controls" id="btn-more-controls" aria-expanded="false" aria-controls="more-controls-menu">☰ 更多</button>
                        <div class="more-controls-menu" id="more-controls-menu" aria-hidden="true">
                            <div class="more-controls-section">
                                <div class="more-controls-title">工具</div>
                                <button class="ctrl-btn btn-random" id="btn-random-teams">🎲 分组和抽签</button>
                                <button class="ctrl-btn btn-console-toggle" id="btn-console-toggle" aria-expanded="false">
                                    <span>C++日志</span>
                                    <span class="console-toggle-count" id="console-toggle-count">0</span>
                                </button>
                            </div>
                            <div class="more-controls-section">
                                <div class="more-controls-title">数据</div>
                                <button class="ctrl-btn btn-sync-db" id="btn-sync-alias-db">☁ 同步云端库</button>
                                <button class="ctrl-btn btn-push-db" id="btn-push-alias-db">⬆ 推送本地库</button>
                            </div>
                            <div class="more-controls-section">
                                <div class="more-controls-title">系统</div>
                                <label class="algo-select-wrap" title="选择死亡X检测算法">
                                    <span>死亡X</span>
                                    <select id="death-algo-select" class="algo-select">
                                        <option value="0">大X颜色个数判断</option>
                                        <option value="1">打补丁红蓝判断</option>
                                    </select>
                                </label>
                            </div>
                            <div class="more-controls-section more-controls-danger">
                                <div class="more-controls-title">危险操作</div>
                                <button class="ctrl-btn btn-clear-teams" id="btn-clear-teams">🗑️ 清空场上</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="dir-bar" id="dir-display" title="点击可更改 TXT 输出目录">📁 战绩输出目录：获取中...</div>
            </div>
        </div>

        <div class="review-backdrop" id="review-backdrop"></div>
        <div class="review-panel" id="review-panel" role="dialog" aria-modal="false" aria-hidden="true" aria-labelledby="review-panel-title">
            <div class="review-header">
                <span id="review-panel-title">最近识别</span>
                <span class="review-count" id="review-count">0</span>
                <button class="review-close" id="btn-review-close" title="关闭">&times;</button>
            </div>
            <div class="review-list" id="review-list"></div>
        </div>
        <div class="console-panel" id="console-panel" role="dialog" aria-modal="false" aria-hidden="true" aria-labelledby="console-panel-title">
            <div class="console-header">
                <span id="console-panel-title">C++ 控制台</span>
                <span class="console-count" id="console-count">0</span>
                <button class="console-clear" id="btn-console-clear" title="清空">清空</button>
                <button class="console-close" id="btn-console-close" title="关闭">&times;</button>
            </div>
            <div class="console-list" id="console-list"></div>
        </div>
    </div>

    <div class="random-tool-overlay" id="random-tool-overlay" aria-hidden="true">
        <div class="random-tool-panel" role="dialog" aria-modal="true" aria-labelledby="random-tool-title">
            <div class="random-tool-header">
                <div>
                    <div class="random-tool-title" id="random-tool-title">随机工具</div>
                    <div class="random-tool-subtitle">随机分组或者抽签</div>
                </div>
                <button class="random-tool-close" id="btn-random-tool-close" title="关闭">&times;</button>
            </div>

            <div class="random-tool-body">
                <div class="random-tool-left">
                    <div class="random-roster-box">
                        <textarea class="random-roster-input" id="random-roster-input" placeholder="一行一个人，可输入库里主号、临时名字或编号&#10;例如：1号&#10;张三&#10;小王"></textarea>
                        <div class="random-roster-suggestions" id="random-roster-suggestions"></div>
                        <div class="random-tool-note">输入库里已有主号时会出现提示；临时名字只用于本次随机，不会写入小号库。</div>
                    </div>

                    <div class="random-options">
                        <label class="random-option-line">
                            <span>分成几组</span>
                            <input type="text" id="random-group-sizes" class="random-group-sizes" value="2" placeholder="默认 2 组">
                        </label>
                        <label class="random-option-line">
                            <span>抽签人数</span>
                            <input type="text" id="random-draw-count" class="random-draw-count" value="1">
                        </label>
                    </div>

                    <div class="random-participant-box">
                        <div class="random-section-title">
                            <span>参与人员</span>
                            <span class="random-participant-count" id="random-participant-count">0</span>
                        </div>
                        <div class="random-participant-list" id="random-participant-list"></div>
                    </div>
                </div>

                <div class="random-tool-right">
                    <div class="random-actions">
                        <button class="random-action-btn primary" id="btn-random-run">随机分组</button>
                        <button class="random-action-btn" id="btn-random-draw">抽签</button>
                        <button class="random-action-btn" id="btn-random-apply">应用到红蓝</button>
                        <button class="random-action-btn" id="btn-random-copy">复制结果</button>
                        <button class="random-action-btn reset" id="btn-random-reset">重置</button>
                    </div>
                    <div class="random-result" id="random-result">
                        <div class="random-empty">输入名单后，可以随机分组或者抽签。</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="appearance-overlay" id="appearance-overlay" aria-hidden="true">
        <div class="appearance-panel" role="dialog" aria-modal="true" aria-labelledby="appearance-title">
            <div class="appearance-header">
                <div>
                    <div class="appearance-title" id="appearance-title">记分板外观</div>
                    <div class="appearance-subtitle">只影响上方红蓝记分板文字</div>
                </div>
                <button class="appearance-close" id="btn-appearance-close" title="关闭">&times;</button>
            </div>
            <div class="appearance-scope-tabs" id="appearance-scope-tabs" data-kill-tab-id="appearance-scope-kill"></div>
            <div class="appearance-body">
                <div class="appearance-style-list" id="appearance-style-list"></div>
                <div class="appearance-editor">
                    <label class="style-field">
                        <span>字体</span>
                        <select id="style-font-family"></select>
                    </label>
                    <label class="style-field">
                        <span>字号</span>
                        <div class="style-range-row">
                            <input id="style-font-size" type="range" min="10" max="48" step="1">
                            <input id="style-font-size-value" type="number" min="10" max="48" step="1">
                        </div>
                    </label>
                    <label class="style-field style-color-mode-row">
                        <span>颜色模式</span>
                        <select id="style-color-mode">
                            <option value="team">跟随队伍色</option>
                            <option value="custom">自定义颜色</option>
                        </select>
                    </label>
                    <label class="style-field">
                        <span>颜色</span>
                        <div class="style-color-row">
                            <input id="style-color" type="color">
                            <input id="style-color-text" type="text" maxlength="7">
                        </div>
                    </label>
                    <label class="style-field">
                        <span>描边颜色</span>
                        <div class="style-color-row">
                            <input id="style-stroke-color" type="color">
                            <input id="style-stroke-color-text" type="text" maxlength="7">
                        </div>
                    </label>
                    <label class="style-field">
                        <span>描边宽度</span>
                        <div class="style-range-row">
                            <input id="style-stroke-width" type="range" min="0" max="4" step="1">
                            <input id="style-stroke-width-value" type="number" min="0" max="4" step="1">
                        </div>
                    </label>
                    <label class="style-field">
                        <span>发光强度</span>
                        <div class="style-range-row">
                            <input id="style-glow" type="range" min="0" max="24" step="1">
                            <input id="style-glow-value" type="number" min="0" max="24" step="1">
                        </div>
                    </label>
                    <div class="kill-layout-section" id="kill-layout-section" hidden></div>
                </div>
            </div>
            <div class="appearance-actions">
                <button class="appearance-action" id="btn-kill-obs-copy">复制OBS网址</button>
                <button class="appearance-action" id="btn-kill-display-open">打开展示窗口</button>
                <button class="appearance-action" id="btn-style-reset-current">恢复当前默认</button>
                <button class="appearance-action danger" id="btn-style-reset-all">恢复全部默认</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="custom-modal">
        <div class="modal-box">
            <div class="modal-msg" id="modal-msg">提示信息</div>
            <input type="text" id="modal-input" class="modal-input" autocomplete="off" style="display:none;">
            <div id="modal-input-help" class="modal-input-help" style="display:none;"></div>
            <div class="modal-btns">
                <button class="modal-btn btn-cancel" id="modal-cancel">取消</button>
                <button class="modal-btn btn-confirm" id="modal-ok">确定</button>
            </div>
        </div>
    </div>

    <script src="main.js?v=20260622-kill-display-toggle" defer></script>
</body>
</html>
