<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNF 赛事计分板 - WebView2 版</title>
    <link rel="stylesheet" href="style.css?v=layout-ref-figure1-fixed">
</head>
<body>

    <div class="app-shell">
        <div class="left-stack">
            <div class="main-container" id="main-container">
                <div class="teams-wrap" id="teams-wrap">
                    <div class="team-panel team-red" id="team-red">
                        <div class="stats-header">
                            <div class="team-name">红队 <input type="text" class="team-score-input" value="0"></div>
                            <div class="stats-labels">
                                <span>击杀</span>
                                <span>死亡</span>
                                <span>AK</span>
                            </div>
                        </div>
                        <div class="rows-container"></div>
                    </div>

                    <div class="team-panel team-blue" id="team-blue">
                        <div class="stats-header">
                            <div class="team-name">蓝队 <input type="text" class="team-score-input" value="0"></div>
                            <div class="stats-labels">
                                <span>击杀</span>
                                <span>死亡</span>
                                <span>AK</span>
                            </div>
                        </div>
                        <div class="rows-container"></div>
                    </div>
                </div>
            </div>

            <div class="control-panel">
                <div class="control-row control-row-main">
                    <button class="ctrl-btn btn-swap" id="btn-swap">🔄 翻转红蓝</button>
                    <button class="ctrl-btn btn-monitor-start" id="btn-monitor">▶ 运行</button>
                    <label class="algo-select-wrap" title="选择死亡X检测算法">
                        <span>死亡X</span>
                        <select id="death-algo-select" class="algo-select">
                            <option value="0">大X颜色个数判断</option>
                            <option value="1">打补丁红蓝判断</option>
                        </select>
                    </label>
                    <button class="ctrl-btn btn-review-toggle" id="btn-review-toggle" aria-expanded="false">
                        <span>&#26368;&#36817;&#35782;&#21035;</span>
                        <span class="review-toggle-count" id="review-toggle-count">0</span>
                    </button>
                </div>
                <div class="control-row control-row-cloud">
                    <button class="ctrl-btn btn-sync-db" id="btn-sync-alias-db">☁ 同步云端库</button>
                    <button class="ctrl-btn btn-push-db" id="btn-push-alias-db">⬆ 推送本地库</button>
                    <button class="ctrl-btn btn-console-toggle" id="btn-console-toggle" aria-expanded="false">
                        <span>C++日志</span>
                        <span class="console-toggle-count" id="console-toggle-count">0</span>
                    </button>
                </div>
                <div class="control-row control-row-tools">
                    <button class="ctrl-btn btn-auth" id="btn-auth">🔑 授权</button>
                    <button class="ctrl-btn btn-pro" id="btn-pro">👑 专业模式</button>
                    <button class="ctrl-btn btn-clear-red" id="btn-clear-red">🗑️ 清空红队</button>
                    <button class="ctrl-btn btn-clear-blue" id="btn-clear-blue">🗑️ 清空蓝队</button>
                    <button class="ctrl-btn btn-reset" id="btn-reset">✨ 重置战绩</button>
                </div>

                <div class="dir-bar" id="dir-display" title="点击可更改 TXT 输出目录">📁 战绩输出目录：获取中...</div>
            </div>
        </div>

        <div class="review-backdrop" id="review-backdrop"></div>
        <div class="review-panel" id="review-panel" role="dialog" aria-modal="false" aria-hidden="true" aria-labelledby="review-panel-title">
            <div class="review-header">
                <span id="review-panel-title">最近识别</span>
                <span class="review-count" id="review-count">0</span>
                <button class="review-close" id="btn-review-close" title="关闭">&times;</button>
            </div>
            <div class="review-list" id="review-list"></div>
        </div>
        <div class="console-panel" id="console-panel" role="dialog" aria-modal="false" aria-hidden="true" aria-labelledby="console-panel-title">
            <div class="console-header">
                <span id="console-panel-title">C++ 控制台</span>
                <span class="console-count" id="console-count">0</span>
                <button class="console-clear" id="btn-console-clear" title="清空">清空</button>
                <button class="console-close" id="btn-console-close" title="关闭">&times;</button>
            </div>
            <div class="console-list" id="console-list"></div>
        </div>
    </div>

    <div class="modal-overlay" id="custom-modal">
        <div class="modal-box">
            <div class="modal-msg" id="modal-msg">提示信息</div>
            <input type="text" id="modal-input" class="modal-input" autocomplete="off" style="display:none;">
            <div id="modal-input-help" class="modal-input-help" style="display:none;"></div>
            <div class="modal-btns">
                <button class="modal-btn btn-cancel" id="modal-cancel">取消</button>
                <button class="modal-btn btn-confirm" id="modal-ok">确定</button>
            </div>
        </div>
    </div>

    <script src="main.js?v=layout-ref-figure1-fixed" defer></script>
</body>
</html>
