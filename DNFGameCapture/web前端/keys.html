<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNF Key Display</title>
    <link rel="stylesheet" href="keys.css?v=20260826-key-mapping-2x7">
</head>
<body>
    <main class="key-stage" id="key-stage">
        <div class="key-grid" id="key-grid" aria-hidden="true"></div>
        <div class="shell-controls" id="shell-controls" hidden>
            <button class="shell-button shell-drag" id="key-window-drag" title="移动窗口" aria-label="移动窗口">&#8942;&#8942;</button>
            <button class="shell-button shell-close" id="key-window-close" title="关闭窗口" aria-label="关闭窗口">&times;</button>
        </div>
        <button class="shell-resize" id="key-window-resize" title="调整窗口大小" aria-label="调整窗口大小" hidden></button>
    </main>
    <script src="keys.js?v=20260826-key-mapping-2x7" defer></script>
</body>
</html>
